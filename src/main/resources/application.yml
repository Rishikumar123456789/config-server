server:
    port: 8888

spring:
    application:
        name: config-server
    cloud:
        config:
            server:
                git:
                    uri: https://github.com/Rishikumar123456789/config-server-repo.git
                    default-label: master
                    clone-on-start: true

eureka:
    client:
        serviceUrl:
            defaultZone: http://eureka-server:8761/eureka/
        register-with-eureka: true
        fetch-registry: true

management:
    endpoints:
        web:
            exposure:
                include: health,info
